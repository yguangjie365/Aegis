[package]
name = "infra"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0"
description = "平台与通用能力：原子写 / PathGuard / 凭据(DPAPI) / SQLite / 日志落盘（W0-09、W0-10 落地）"

[dependencies]
contracts = { path = "../contracts" }
# M-01 本机概览（2026-10-03）：FFI 边界只允许出现在本 crate（02 册 KN-04），
# 故注册表只读探测与 IPv4 TCP 表读取的 Windows 依赖挂在这里。
# 🔴 sidecar 的 stdio 报文结构（serde）不放本 crate：本层只管进程与行的收发，
# 协议语义归 `services::overview`，这样本 crate 零新增通用依赖。
# winreg / windows-sys 版本均钉 NexBox `Cargo.toml` 实测（0.52 / 0.59，后者其 `game_ping.rs`
# 与 `overlay_panel.rs` 已用同一 IpHelper 绑定）；features 只开本文件用到的三项，不抄全量。
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# M-01 本机概览 片2-a/2-b（2026-10-03）：静态硬件采集的两条 FFI 通道同样只能落本 crate
# （04 分册 §一 准入表"FFI 只出现在 infra 与 elevated-helper"）。
# 版本钉 NexBox `Cargo.toml` 声明 + 其 `Cargo.lock` 实测（wmi 0.14 → 0.14.5 / nvml-wrapper 0.10 → 0.10.0）；
# ADR-003 五步登记见 ../../../DEPENDENCIES.md §一，NVML 只供静态规格项的 K-004 闸见同文件 §五。
# features 取默认值：wmi 的 `chrono`（本层不用 chrono 类型，但 NexBox 同版同 features）、
# nvml-wrapper 的 `default = []`（🔴 不开 legacy-functions / serde，只用现行 API）。
wmi = "0.14"
nvml-wrapper = "0.10"
# M-01 片3-c（2026-10-03）：SMART 读取日志
log = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # SMART: DeviceIoControl / CreateFileW 所需
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    # 剪贴板（F-FT-33 从剪贴板读入 / F-FT-34 接收文本=剪贴板写入成功）：
    # OpenClipboard / SetClipboardData / GlobalAlloc 所需
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[lints]
workspace = true
