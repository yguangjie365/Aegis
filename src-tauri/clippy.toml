msrv = "1.77.2"

# AsyncGuard（03 测试与验收规范）：异步上下文禁忙等自旋/同步睡眠，正解 = tokio::time::sleep 或 spawn_blocking
disallowed-methods = [
    { path = "std::thread::sleep", reason = "异步路径禁阻塞（01 总览 §5.1 禁 sync-over-async）；用 tokio::time::sleep 或 spawn_blocking" },
]

